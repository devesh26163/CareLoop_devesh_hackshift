<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>CareLoop</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;600&display=swap">
<style>
:root{--bg:#EEF5F2;--cd:#fff;--ink:#0F2A2E;--mu:#56707A;--ln:#D5E3DF;--tl:#0E7C7B;--on:#fff;--co:#D9482F;--su:#F5B83D;--vi:#6C5CE7;--tb:#D7EEEA;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0B1B1E;--cd:#112B2E;--ink:#E7F3F0;--mu:#93B0B2;--ln:#1F4144;--tl:#3FC7B8;--on:#04201F;--co:#FF7B66;--su:#F7C85C;--vi:#9A8CFF;--tb:#14403F}}
:root[data-theme=dark]{--bg:#0B1B1E;--cd:#112B2E;--ink:#E7F3F0;--mu:#93B0B2;--ln:#1F4144;--tl:#3FC7B8;--on:#04201F;--co:#FF7B66;--su:#F7C85C;--vi:#9A8CFF;--tb:#14403F}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Figtree,system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
h1,h2,h3{font-family:'Bricolage Grotesque',system-ui,sans-serif;line-height:1.1;margin:0 0 .5rem;letter-spacing:-.02em}
h1{font-size:clamp(2.2rem,6vw,3.8rem);font-weight:800}h2{font-size:1.5rem}h3{font-size:1.1rem}
p{margin:.3rem 0 .8rem;max-width:62ch}a{color:inherit}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;background:var(--bg);border-bottom:1px solid var(--ln)}
.bar1{display:flex;align-items:center;justify-content:space-between;gap:.6rem;padding:.6rem 1rem;max-width:1100px;margin:auto}
.logo{font:800 1.3rem 'Bricolage Grotesque',sans-serif;text-decoration:none;display:flex;gap:.4rem;align-items:center}
nav{display:flex;gap:.25rem;overflow-x:auto;padding:0 1rem .5rem;max-width:1100px;margin:auto;scrollbar-width:none}
nav a{white-space:nowrap;text-decoration:none;padding:.35rem .8rem;border-radius:99px;font-weight:600;color:var(--mu)}
nav a.on{background:var(--tl);color:var(--on)}
main{max-width:1100px;margin:auto;padding:1.5rem 1rem 4rem}
.btn{display:inline-block;border:0;cursor:pointer;background:var(--tl);color:var(--on);font:600 1rem Figtree,sans-serif;padding:.7rem 1.3rem;border-radius:99px;text-decoration:none}
.btn.alt{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}.btn.sm{padding:.4rem .9rem}.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:focus-visible,nav a:focus-visible,.chip:focus-visible,input:focus-visible,.sw:focus-visible,svg a:focus-visible{outline:3px solid var(--su);outline-offset:2px}
.chipx{display:flex;align-items:center;gap:.5rem;text-decoration:none;background:var(--cd);border:1px solid var(--ln);border-radius:99px;padding:.25rem .8rem .25rem .3rem;font-size:.9rem}
.lvl{background:var(--su);color:#2b1d00;border-radius:99px;padding:.1rem .6rem;font-weight:800}
.xpb{width:60px;height:8px;background:var(--ln);border-radius:9px;overflow:hidden}.xpb i{display:block;height:100%;background:var(--co);transition:width .5s}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:1rem;align-items:center}
@media(max-width:800px){.hero{grid-template-columns:1fr}.xpb,.hide{display:none}}
.row{display:flex;gap:.7rem;flex-wrap:wrap;align-items:center}.fine{font-size:.85rem;color:var(--mu)}
.card{background:var(--cd);border:1px solid var(--ln);border-radius:22px;padding:1.2rem;margin:0 0 1rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:1rem}.grid .card{margin:0}
.ph{margin-bottom:1.2rem}
.quest{display:inline-flex;gap:.6rem;align-items:center;background:var(--tb);border-radius:14px;padding:.45rem .9rem;font-weight:600}.quest i{font-style:normal;background:var(--su);color:#2b1d00;border-radius:99px;padding:0 .6rem}.quest.ok{opacity:.7}
.big{font:800 2.6rem 'Bricolage Grotesque',sans-serif;color:var(--tl)}
.chip{border:2px solid var(--ln);background:var(--cd);color:var(--ink);border-radius:99px;padding:.4rem .9rem;cursor:pointer;font:600 .95rem Figtree,sans-serif;margin:0 .3rem .4rem 0}
.chip.on{border-color:var(--tl);background:var(--tb)}
.sw{width:50px;height:28px;border-radius:99px;border:0;background:var(--ln);position:relative;cursor:pointer;flex:none}.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}.sw[aria-pressed=true]{background:var(--tl)}.sw[aria-pressed=true]::after{left:25px}
.line{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.7rem 0;border-bottom:1px solid var(--ln)}.line:last-child{border:0}
.meter{height:8px;background:var(--ln);border-radius:9px;overflow:hidden}.meter i{display:block;height:100%}
input[type=range]{width:100%;accent-color:var(--tl)}
input[type=text],input[type=email]{width:100%;padding:.7rem 1rem;border-radius:14px;border:2px solid var(--ln);background:var(--cd);color:var(--ink);font:1rem Figtree,sans-serif;margin:.3rem 0 .8rem}
.err{color:var(--co);font-weight:600}.good{color:var(--tl);font-weight:600}
.lad{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem}.lad div{border:2px solid var(--ln);border-radius:16px;padding:.8rem;opacity:.55}.lad .a{opacity:1;border-color:var(--tl);background:var(--tb)}.lad .a.s{border-color:var(--co)}
@media(max-width:600px){.lad{grid-template-columns:1fr}}
.stp{display:flex;gap:.5rem;margin-bottom:1rem}.stp b{flex:1;padding:.5rem;border-radius:12px;background:var(--ln);text-align:center;font-size:.9rem}.stp b.a{background:var(--tl);color:var(--on)}
.bub{background:var(--tb);border-radius:18px 18px 18px 4px;padding:.8rem 1rem;max-width:380px}
.badge{text-align:center;padding:1rem .5rem}.badge span{display:block;font-size:2rem;filter:grayscale(1);opacity:.35}.badge.on span{filter:none;opacity:1}
.av{font-size:1.6rem;background:var(--cd);border:2px solid var(--ln);border-radius:16px;width:54px;height:54px;cursor:pointer}.av.on{border-color:var(--tl);background:var(--tb)}
#toast{position:fixed;left:50%;bottom:calc(1.2rem + env(safe-area-inset-bottom,0px));transform:translate(-50%,200%);background:var(--ink);color:var(--bg);padding:.7rem 1.2rem;border-radius:99px;font-weight:600;transition:.35s;z-index:30}#toast.s{transform:translate(-50%,0)}
.cf{position:fixed;top:-10px;width:10px;height:14px;z-index:40;animation:fall 2.2s ease-in forwards}@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
.nd{transition:transform .2s;transform-box:fill-box;transform-origin:center}svg a:hover .nd{transform:scale(1.12)}
.dz{display:block;position:relative;border:3px dashed var(--tl);border-radius:26px;padding:2.5rem 1rem;text-align:center;cursor:pointer;background:var(--tb);transition:.2s}.dz.hv,.dz:hover{transform:scale(1.01);background:var(--cd)}.dz:focus-within{outline:3px solid var(--su)}.dz input{position:absolute;opacity:0;width:1px;height:1px}
.phone{width:270px;min-height:440px;margin:auto;border:8px solid var(--ink);border-radius:38px;background:var(--bg);position:relative;overflow:hidden;padding:1rem}
.apps{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}.app{border:0;border-radius:18px;background:var(--cd);padding:.7rem;cursor:pointer;color:var(--ink);font:600 .85rem Figtree,sans-serif;text-align:center}.app span{font-size:1.8rem;display:block}
.lock{position:absolute;inset:0;background:var(--ink);color:var(--bg);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:1.2rem;gap:.6rem}
.nud{background:var(--su);color:#2b1d00;border-radius:14px;padding:.6rem;margin:.6rem 0;font-weight:600;font-size:.9rem}
.cols{display:grid;grid-template-columns:300px 1fr;gap:1.2rem;align-items:start}@media(max-width:800px){.cols{grid-template-columns:1fr}}
@keyframes pl{from{transform:scaleX(.15)}to{transform:scaleX(1)}}
.face{font-size:2rem;background:var(--cd);border:2px solid var(--ln);border-radius:20px;width:64px;height:78px;cursor:pointer;color:var(--ink);transition:.15s}.face small{display:block;font-size:.8rem;color:var(--mu)}.face:hover{border-color:var(--tl);transform:translateY(-3px)}
.brc{width:120px;height:120px;border-radius:50%;background:var(--tb);border:4px solid var(--tl);margin:1rem auto;animation:brt 8s ease-in-out infinite}@keyframes brt{0%,100%{transform:scale(.6)}50%{transform:scale(1)}}
.pu circle{animation:pul 1.6s ease-in-out infinite}@keyframes pul{50%{stroke-width:10px}}.vc{touch-action:none;cursor:ns-resize;user-select:none}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body>
<header><div class="bar1"><a class="logo" href="#/home" aria-label="CareLoop home"><svg width="28" height="28" viewBox="0 0 28 28"><circle cx="14" cy="14" r="10" fill="none" stroke="var(--tl)" stroke-width="4" stroke-dasharray="48 16"/><circle cx="14" cy="14" r="3.5" fill="var(--co)"/></svg>CareLoop</a><div class="row" id="hud"></div></div><nav id="nav" aria-label="Pages"></nav></header>
<main id="app"></main><div id="toast" role="status"></div>
<script>
const K='careloop-v1',$=s=>document.querySelector(s),app=$('#app');
let S={name:'',email:'',av:'🙂',xp:0,done:{},c:{},cn:'',streak:1,last:''};
try{Object.assign(S,JSON.parse(localStorage.getItem(K)||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const td=new Date().toDateString(),yd=new Date(Date.now()-864e5).toDateString();
if(S.last!==td){S.streak=S.last===yd?S.streak+1:1;S.last=td;save()}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MODS=[['decoder','Decode','📄','decoder','Prescription Decoder'],['remind','Remind','⏰','decoder','Smart Reminders'],['vitals','Watch','💓','vitals','Vitals Watch'],['symptom','Check','🩺','checkin','Symptom Check-in'],['mind','Mind','🧠','checkin','Wellbeing Check'],['coach','Coach','🌱','coach','Lifestyle Coach']];
const PAGES=[['home','Home'],['story','Story'],['decoder','Decoder'],['vitals','Vitals'],['checkin','Check-in'],['coach','Coach'],['trust','Trust'],['roadmap','Roadmap'],['me','Quests']];
const lv=()=>Math.floor(S.xp/80)+1,nDone=()=>MODS.filter(m=>S.done[m[0]]).length;
let tt;const toast=m=>{const t=$('#toast');t.textContent=m;t.className='s';clearTimeout(tt);tt=setTimeout(()=>t.className='',2600)};
function confetti(){if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;for(let i=0;i<40;i++){const e=document.createElement('i');e.className='cf';e.style.cssText=`left:${Math.random()*100}vw;background:${['#F5B83D','#E8553F','#0E7C7B','#6C5CE7'][i%4]};animation-delay:${Math.random()*.6}s`;document.body.appendChild(e);setTimeout(()=>e.remove(),3200)}}
function award(k,xp,m){if(S.done[k])return;const l=lv();S.done[k]=1;S.xp+=xp;save();toast(`+${xp} XP · ${m}`);if(lv()>l||nDone()==6)confetti();if(nDone()==6)setTimeout(()=>toast('Loop closed! You earned the Loop Keeper title'),1800);hud()}
function hud(){$('#hud').innerHTML=`<a class="chipx" href="#/me"><span>${S.name?S.av:'🙂'}</span><span class="lvl">Lv ${lv()}</span><span class="xpb"><i style="width:${S.xp%80/.8}%"></i></span><span class="hide">${S.xp} XP</span><span>🔥${S.streak}</span></a>`+(S.name?'':'<a class="btn sm" href="#/signin">Sign in</a>')}
const head=(t,s,q)=>`<div class="ph"><h1>${t}</h1><p>${s}</p>${q?`<div class="quest">${S.done[q[0]]?'✓':'★'} ${q[2]} <i>+${q[1]} XP</i></div>`:''}</div>`;
const sw=(k,on)=>`<button class="sw" role="switch" aria-pressed="${!!on}" data-a="tg" data-v="${k}"></button>`;
const chips=(arr,sel,a)=>arr.map((x,i)=>`<button class="chip ${sel(i)?'on':''}" data-a="${a}" data-v="${i}">${x}</button>`).join('');
let st={},page='home';
const NOTE='Illustrative demo. A support tool, not a diagnosis.';
const P={
home(){const pts=MODS.map((m,i)=>{const a=(-90+60*i)*Math.PI/180,x=220+130*Math.cos(a),y=220+130*Math.sin(a),d=S.done[m[0]],lx=220+182*Math.cos(a),ly=220+182*Math.sin(a);return `<a href="#/${m[3]}" aria-label="${m[4]}"><g class="nd${!d&&NX()==m[0]?' pu':''}"><circle cx="${x}" cy="${y}" r="32" fill="${d?'var(--tl)':'var(--cd)'}" stroke="var(--tl)" stroke-width="3"/><text x="${x}" y="${y+9}" text-anchor="middle" font-size="26">${d?'✓':m[2]}</text></g><text x="${lx}" y="${ly+4}" text-anchor="middle" font-size="14" font-weight="600" fill="var(--ink)">${m[1]}</text></a>`}).join('');
return `<section class="hero"><div><h1>Care that acts before the crisis.</h1><p>One app that explains your prescriptions, watches your vitals and cares for your mind between doctor visits.</p><div class="row"><a class="btn" href="#/story">Start the story</a>${S.name?'':'<a class="btn alt" href="#/signin">Sign in</a>'}</div><p class="fine">Tap a module on the loop to play it. Close all six to become a Loop Keeper. ${NOTE} Consent-first and privacy-first.</p></div>
<svg viewBox="0 0 440 440" role="img" aria-label="CareLoop: six modules in one loop"><circle cx="220" cy="220" r="130" fill="none" stroke="var(--ln)" stroke-width="10"/><circle cx="220" cy="220" r="130" fill="none" stroke="var(--co)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${816.8*nDone()/6} 817" transform="rotate(-90 220 220)"/><text x="220" y="222" text-anchor="middle" font-size="56" font-weight="800" fill="var(--ink)" font-family="Bricolage Grotesque,sans-serif">${nDone()}/6</text><text x="220" y="248" text-anchor="middle" font-size="14" fill="var(--mu)">loop closed</text>${pts}</svg></section>
${QB()}<div class="card"><h2>Explain, track, spot changes, support</h2><p>Reminder apps stop at the pill box and wellbeing apps stop at the chat. CareLoop connects both, with consent-based trusted-contact alerts when it matters.</p></div>`},
story(){const S3=[['The prescription','A handwritten note full of jargon, in a language she reads slowly. Imagine a patient on long-term medicines.'],['The gap','Unsure of the dose, she skips one. Nobody sees it.'],['The emergency','Warning signs go unnoticed between visits until it becomes a crisis.']];
return head('It starts with one missed dose','An illustrative story, not a real patient.',['story',20,'Play through the story'])+`<div class="card"><div class="stp">${S3.map((x,i)=>`<b class="${i==Math.min(st.s,2)?'a':''}">${x[0]}</b>`).join('')}</div>${st.s<3?`<h2>${S3[st.s][0]}</h2><p>${S3[st.s][1]}</p>${st.s==1?`<button class="btn alt" data-a="nx">Nobody helps: she skips the dose</button> <button class="btn" data-a="ask">Imagine CareLoop is here</button>`:`<button class="btn" data-a="nx">${st.s<2?'Next moment':'Rewind with CareLoop'}</button>`}`:`<h2>Same story, with CareLoop</h2><p>✓ The decoder explains the note in her language.<br>✓ A reminder arrives with the exact dose.<br>✓ Vitals Watch flags the change before the emergency.</p><p class="good">CareLoop closes the gaps between doctor visits.</p><a class="btn" href="#/decoder">Try the decoder</a>`}</div>
<h2>This is not rare</h2><div class="grid"><div class="card"><div class="big">~50%</div>of people on long-term therapy in developed countries do not take medicines as prescribed (WHO, 2003).</div><div class="card"><div class="big">30-50%</div>of medicines for chronic disease are not taken as prescribed (Peng et al., 2020).</div><div class="card"><div class="big">7-40%</div>gain in self-reported adherence in 5 of 11 app studies (Perez-Jover et al., 2019).</div><div class="card"><div class="big">91.7%</div>of trial participants were satisfied with the app (144 of 156). Early, low-quality evidence.</div></div>`},
decoder(){if(!st.up)return DZ();if(st.pr<100)return SCN();const R=[['Metformin','500 mg','Twice a day, after meals',96],['Amlodipine','5 mg','Once at night',91],['Atorva?tatin','1O mg','Once at night',48]],O=['Atorvastatin 10 mg','Atorvastatin 20 mg'];
const E={en:['Helps control blood sugar. Take 1 tablet twice a day, after food.','Keeps blood pressure down. Take 1 tablet at night.','Lowers cholesterol. Take 1 tablet at night.'],hi:['शुगर नियंत्रित करती है। दिन में दो बार खाने के बाद 1 गोली लें।','ब्लड प्रेशर कम रखती है। रात में 1 गोली लें।','कोलेस्ट्रॉल घटाती है। रात में 1 गोली लें।']};
const all=st.ok.every(x=>x),nm=st.pick!=null?O[st.pick]:null;
const rows=R.map((r,i)=>{const ok=st.ok[i],low=r[3]<60;return `<div class="card"><div class="line" style="border:0;padding:0"><h3>${ok&&low?nm:esc(r[0]+' '+r[1])}</h3><span class="${low&&!ok?'err':'good'}">${r[3]}% sure</span></div><div class="meter"><i style="width:${r[3]}%;background:${low?'var(--co)':'var(--tl)'}"></i></div><p>${r[2]}. ${E[st.lang][i]}</p><button class="chip" data-a="sp">🔊 Listen</button>${ok?'<span class="good">✓ Confirmed by you</span>':low?`<p class="err">Low confidence. Nothing is saved until you fix it.</p>${chips(O,j=>st.pick===j,'pk')}<button class="chip" data-a="rs">Rescan instead</button>${st.warn?'<p class="err">Not saved. Rescan or ask your pharmacist.</p>':''}${st.pick!=null?`<br><button class="btn sm" data-a="cf" data-v="${i}">Confirm ${nm}</button>`:''}`:`<button class="btn sm" data-a="cf" data-v="${i}">Confirm</button>`}</div>`}).join('');
return head('Prescription decoder','Confirm every field before a reminder exists. CareLoop never guesses silently.',['decoder',40,'Confirm all three fields'])+`<div class="row" style="margin-bottom:1rem">${st.url?`<img src="${st.url}" alt="Your prescription" style="height:56px;border-radius:10px">`:'<span class="chip on">📄 '+esc(st.up)+'</span>'}${chips(['English','हिन्दी'],i=>(st.lang=='en')==(i==0),'lg')}</div>${rows}${all?`<div class="card"><h3>Safety checks</h3><p class="good">✓ Drug names matched ✓ Dose ranges plausible ✓ No interaction or allergy flags</p>${st.set?`<h3>Reminders set</h3>${[['8:00 am','Metformin 500 mg, after breakfast'],['8:00 pm','Metformin 500 mg, after dinner'],['10:00 pm','Amlodipine 5 mg + '+nm]].map((r,i)=>`<div class="line"><span><b>${r[0]}</b> ${r[1]}</span>${st.tk[i]?'<span class="good">✓ Taken</span>':`<button class="btn sm" data-a="tk" data-v="${i}">Mark taken</button>`}</div>`).join('')}<p class="fine">Skipped doses are logged. Repeated misses prompt a nudge and, with consent, your trusted contact. ${NOTE}</p>`:'<button class="btn" data-a="sr">Set reminders</button>'}</div>`:''}`},
vitals(){return head('Vitals that watch back','Drag the 3 pm heart rate. Alerts arrive in layers, never all at once.',['vitals',40,'Trigger an alert and let it persist'])+`<div class="card"><label for="hr"><b>Heart rate at 3 pm</b></label><input id="hr" type="range" min="60" max="170" value="${st.v}" data-i="v"><button class="btn alt" data-a="live">${tm?'Stop live feed':'Start live feed'}</button><div id="out">${O.vitals()}</div></div><p class="fine">Fitbit and Health Connect feed heart rate, SpO2 and sleep. Glucose needs a CGM or manual entry. ${NOTE}</p>`},
checkin(){const sym=['Tiredness','Cough','Weight change','Poor sleep','Pain','Appetite loss'],nmz=['Sleep','Energy','Mood','Stress'];
const tabs=`<div class="row" style="margin-bottom:1rem">${chips(['Symptom check-in','Wellbeing check'],i=>(st.t=='sym')==(i==0),'tb')}</div>`;
return head('Early-warning check-in','Five minutes, adaptive, and never a diagnosis.',[st.t=='sym'?'symptom':'mind',40,st.t=='sym'?'Save a symptom check-in':'Save today’s wellbeing check'])+tabs+(st.t=='sym'?`<div class="card"><h3>What have you noticed?</h3>${chips(sym,i=>st.ch.includes(i),'ch')}<p><b>For how many days?</b></p><input type="range" min="1" max="30" value="${st.d}" aria-label="Days" data-i="d"><div id="out">${O.checkin()}</div></div>`:`<div class="card"><p><b>Rate each from 1 to 5</b></p>${nmz.map((n,i)=>`<label>${n}</label><input type="range" min="1" max="5" value="${st.m[i]}" aria-label="${n}" data-i="m${i}">`).join('')}<label>Low days in a row</label><input type="range" min="0" max="6" value="${st.l}" data-i="l"><label class="row" style="margin-top:.6rem">${sw('i9',st.i9)}<span>Test the safety path: I have had thoughts of self-harm</span></label><div id="out">${O.checkin()}</div></div>`)},

O.vitals=()=>{const d=st.hr,y=v=>200-(v-50)*1.2,x=i=>40+i*104,hi=st.v>110,c=S.c.contact;return `<svg id='vc' class='vc' viewBox='0 0 600 230' role='img' aria-label='Heart rate chart. Drag a point to change it.'><rect x='30' y='${y(170)}' width='550' height='${y(110)-y(170)}' fill='var(--co)' opacity='.1'/><line x1='30' x2='580' y1='${y(110)}' y2='${y(110)}' stroke='var(--co)' stroke-dasharray='6 4'/><text x='580' y='${y(110)+16}' text-anchor='end' font-size='12' fill='var(--co)'>alert zone above 110</text><polyline fill='none' stroke='var(--tl)' stroke-width='4' points='${d.map((v,i)=>x(i)+','+y(v)).join(' ')}'/>${d.map((v,i)=>`<circle cx='${x(i)}' cy='${y(v)}' r='${i==st.pi?11:7}' fill='${v>110?'var(--co)':'var(--tl)'}' stroke='var(--cd)' stroke-width='3'/><text x='${x(i)}' y='224' text-anchor='middle' font-size='12' fill='var(--mu)'>${HH[i]}</text>`).join('')}</svg><h3>${st.v} bpm peak</h3><div class='line'><span>1. In-app alert first</span><b class='${hi?'err':'good'}'>${hi?'Above your limit. Rest and recheck.':'Within your range'}</b></div><div class='line'><span>2. Still high after 30 minutes?</span>${sw('pe',st.p)}</div><div class='line'><span>3. Trusted contact, only if it persists</span><b class='${hi&&st.p&&c?'err':''}'>${!(hi&&st.p)?'Not needed':c?`Message sent: “please check in on ${esc(S.name||'this person')}”`:'Not sent: you have not opted in (Trust page)'}</b></div>`};
let dg=0;
const mv=e=>{const s=$('#vc');if(!dg||page!='vitals'||!s)return;const r=s.getBoundingClientRect(),Y=(e.clientY-r.top)/r.height*230,v=Math.max(55,Math.min(170,Math.round((200-Y)/1.2+50)));st.hr[st.pi]=v;st.v=Math.max(...st.hr);$('#out').innerHTML=O.vitals();$('#hr').value=v;$('#hv').textContent=v};
document.addEventListener('pointerdown',e=>{const s=e.target.closest&&e.target.closest('#vc');if(page!='vitals'||!s)return;const r=s.getBoundingClientRect(),X=(e.clientX-r.left)/r.width*600;st.pi=Math.max(0,Math.min(5,Math.round((X-40)/104)));dg=1;mv(e)});
document.addEventListener('pointermove',mv);
['pointerup','pointercancel'].forEach(n=>addEventListener(n,()=>{if(dg){dg=0;draw()}}));
Object.assign(A,{hp(v){st.pi=+v},ask(){st.s=3;award('story',20,'Story complete')},live(){if(tm){stopT();return}tm=setInterval(()=>{if(page!='vitals')return stopT();const i=st.pi;st.hr[i]=Math.max(62,Math.min(165,Math.round(st.hr[i]+(Math.random()-.45)*18)));st.v=Math.max(...st.hr);$('#out').innerHTML=O.vitals();$('#hr').value=st.hr[i];$('#hv').textContent=st.hr[i]},800)}});
function draw(){app.innerHTML=P[page]();if(page=='signin'&&st.err)$('#out').innerHTML=`<p class="err" role="alert">${st.err}</p>`;$('#nav').innerHTML=PAGES.map(p=>`<a href="#/${p[0]}" class="${p[0]==page?'on':''}">${p[1]}</a>`).join('');hud()}
function route(){stopT();const p=location.hash.slice(2)||'home';page=P[p]?p:'home';st=(INIT[page]||(()=>({})))();scrollTo(0,0);draw();document.title='CareLoop · '+page}
addEventListener('hashchange',route);
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(t){A[t.dataset.a](t.dataset.v,t);if(t.dataset.a!='sp')draw()}});
document.addEventListener('input',e=>{const t=e.target,f=INP[t.dataset.i];if(f){f(t.value);if(page=='signin')return;const o=$('#out');if(o)o.innerHTML=O[page]()}});
route();
</script></body></html>
